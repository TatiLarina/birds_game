<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wormy Wings — Птичий пир</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
    try {
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');

        var W = 480;
        var H = 640;
        canvas.width = W;
        canvas.height = H;

        // Helper: rounded rect
        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // Helper: ellipse using arc + scale
        function drawEllipse(cx, cy, rx, ry) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(rx / ry, 1);
            ctx.beginPath();
            ctx.arc(0, 0, ry, 0, Math.PI * 2);
            ctx.closePath();
            ctx.restore();
            ctx.fill();
        }

        // Game states
        var STATE_MENU = 0;
        var STATE_PLAYING = 1;
        var STATE_GAMEOVER = 2;
        var gameState = STATE_MENU;

        // Bird types
        var BIRDS = {
            pigeon: { name: 'Голубь', difficulty: 1, speed: 2, size: 28, desc: 'Толстый, медленный', flapForce: -7 },
            tit: { name: 'Синичка', difficulty: 2, speed: 3, size: 22, desc: 'Маленькая, средняя', flapForce: -8 },
            swallow: { name: 'Ласточка', difficulty: 3, speed: 4, size: 18, desc: 'Очень быстрая', flapForce: -9 }
        };

        // Game variables
        var selectedBird = null;
        var bird = null;
        var obstacles = [];
        var worms = [];
        var particles = [];
        var score = 0;
        var lives = 3;
        var gameSpeed = 1;
        var frameCount = 0;
        var spawnTimer = 0;
        var wormTimer = 0;
        var highScore = 0;
        var prevHighScore = 0;
        var newRecord = false;
        var locationType = null;
        var timeOfDay = null;
        var menuSelection = 0;
        var stars = [];
        var clouds = [];
        var bgElements = [];
        var groundOffset = 0;
        var shakeTimer = 0;
        var invincibleTimer = 0;
        var scorePopups = [];
        var keysDown = {};

        // Load high score
        try {
            highScore = parseInt(localStorage.getItem('wormyWingsHighScore')) || 0;
        } catch(e) {
            highScore = 0;
        }
        prevHighScore = highScore;

        function generateBackground() {
            locationType = Math.random() < 0.5 ? 'city' : 'forest';
            timeOfDay = Math.random() < 0.5 ? 'day' : 'night';
            stars = [];
            clouds = [];
            bgElements = [];

            if (timeOfDay === 'night') {
                for (var i = 0; i < 60; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H * 0.6,
                        size: Math.random() * 2.5 + 0.5,
                        twinkle: Math.random() * Math.PI * 2
                    });
                }
            } else {
                for (var i = 0; i < 5; i++) {
                    clouds.push({
                        x: Math.random() * W,
                        y: Math.random() * H * 0.35 + 20,
                        size: Math.random() * 40 + 30,
                        speed: Math.random() * 0.3 + 0.1
                    });
                }
            }

            if (locationType === 'city') {
                for (var i = 0; i < 8; i++) {
                    var wl = [];
                    for (var j = 0; j < 10; j++) wl.push(Math.random() < 0.55);
                    bgElements.push({
                        x: i * 70 + Math.random() * 20,
                        height: Math.random() * 120 + 60,
                        width: Math.random() * 40 + 30,
                        hue: Math.random() * 30 + 200,
                        lightness: Math.random() * 20 + 30,
                        windows: Math.floor(Math.random() * 4 + 2),
                        windowLit: wl
                    });
                }
            } else {
                for (var i = 0; i < 12; i++) {
                    var isPine = Math.random() < 0.5;
                    var hue = isPine ? (120 + Math.random()*40) : (80 + Math.random()*30);
                    var sat = isPine ? 50 : 40;
                    var lit = isPine ? (25 + Math.random()*15) : (30 + Math.random()*15);
                    bgElements.push({
                        x: i * 45 + Math.random() * 20,
                        height: Math.random() * 80 + 40,
                        type: isPine ? 'pine' : 'leaf',
                        color: 'hsl(' + hue + ',' + sat + '%,' + lit + '%)'
                    });
                }
            }
        }

        function drawBackground() {
            // Sky
            var skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            if (timeOfDay === 'day') {
                skyGrad.addColorStop(0, '#87CEEB');
                skyGrad.addColorStop(0.6, '#B0E0FF');
                skyGrad.addColorStop(1, '#E8F5E9');
            } else {
                skyGrad.addColorStop(0, '#0a0a2a');
                skyGrad.addColorStop(0.5, '#1a1a4a');
                skyGrad.addColorStop(1, '#2a2a3a');
            }
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H);

            if (timeOfDay === 'night') {
                // Stars
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    s.twinkle += 0.03;
                    var alpha = 0.5 + Math.sin(s.twinkle) * 0.5;
                    ctx.fillStyle = 'rgba(255, 255, 220, ' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Moon
                ctx.fillStyle = '#FFFDE7';
                ctx.beginPath();
                ctx.arc(380, 70, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a4a';
                ctx.beginPath();
                ctx.arc(395, 60, 30, 0, Math.PI * 2);
                ctx.fill();
                // Moon glow
                var moonGlow = ctx.createRadialGradient(380, 70, 30, 380, 70, 80);
                moonGlow.addColorStop(0, 'rgba(255,255,200,0.15)');
                moonGlow.addColorStop(1, 'rgba(255,255,200,0)');
                ctx.fillStyle = moonGlow;
                ctx.beginPath();
                ctx.arc(380, 70, 80, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Sun
                var sunGlow = ctx.createRadialGradient(80, 60, 20, 80, 60, 70);
                sunGlow.addColorStop(0, 'rgba(255,255,100,0.8)');
                sunGlow.addColorStop(0.5, 'rgba(255,200,50,0.3)');
                sunGlow.addColorStop(1, 'rgba(255,200,50,0)');
                ctx.fillStyle = sunGlow;
                ctx.beginPath();
                ctx.arc(80, 60, 70, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FFE44D';
                ctx.beginPath();
                ctx.arc(80, 60, 25, 0, Math.PI * 2);
                ctx.fill();

                // Clouds
                for (var ci = 0; ci < clouds.length; ci++) {
                    var c = clouds[ci];
                    c.x -= c.speed;
                    if (c.x < -80) c.x = W + 80;
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(c.x + c.size * 0.3, c.y - c.size * 0.15, c.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(c.x + c.size * 0.6, c.y, c.size * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(c.x + c.size * 0.3, c.y + c.size * 0.1, c.size * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Background elements
            if (locationType === 'city') {
                for (var bi = 0; bi < bgElements.length; bi++) {
                    var b = bgElements[bi];
                    var baseY = H - 80;
                    ctx.fillStyle = 'hsl(' + b.hue + ', 20%, ' + b.lightness + '%)';
                    ctx.fillRect(b.x, baseY - b.height, b.width, b.height);
                    ctx.fillStyle = timeOfDay === 'night' ? '#333' : '#666';
                    ctx.fillRect(b.x - 3, baseY - b.height - 5, b.width + 6, 8);
                    // Windows
                    var wi = 0;
                    for (var wy = 0; wy < b.windows; wy++) {
                        for (var wx = 0; wx < 2; wx++) {
                            if (timeOfDay === 'night') {
                                var lit = b.windowLit[wi % b.windowLit.length];
                                ctx.fillStyle = lit ? '#FFE082' : '#222';
                            } else {
                                ctx.fillStyle = '#B3E5FC';
                            }
                            ctx.fillRect(b.x + 5 + wx * (b.width/2 - 2), baseY - b.height + 15 + wy * 22, 8, 10);
                            wi++;
                        }
                    }
                }
            } else {
                for (var bi = 0; bi < bgElements.length; bi++) {
                    var b = bgElements[bi];
                    var baseY = H - 80;
                    ctx.fillStyle = '#5D4037';
                    ctx.fillRect(b.x + 8, baseY - b.height * 0.4, 8, b.height * 0.4);
                    ctx.fillStyle = b.color;
                    if (b.type === 'pine') {
                        ctx.beginPath();
                        ctx.moveTo(b.x + 12, baseY - b.height);
                        ctx.lineTo(b.x - 5, baseY - b.height * 0.3);
                        ctx.lineTo(b.x + 29, baseY - b.height * 0.3);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(b.x + 12, baseY - b.height * 0.75);
                        ctx.lineTo(b.x - 8, baseY - b.height * 0.15);
                        ctx.lineTo(b.x + 32, baseY - b.height * 0.15);
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(b.x + 12, baseY - b.height * 0.6, b.height * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + 5, baseY - b.height * 0.5, b.height * 0.25, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + 20, baseY - b.height * 0.5, b.height * 0.25, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Ground
            var groundGrad = ctx.createLinearGradient(0, H - 80, 0, H);
            if (locationType === 'city') {
                groundGrad.addColorStop(0, timeOfDay === 'night' ? '#333' : '#666');
                groundGrad.addColorStop(1, timeOfDay === 'night' ? '#222' : '#444');
            } else {
                groundGrad.addColorStop(0, timeOfDay === 'night' ? '#1a3a1a' : '#4CAF50');
                groundGrad.addColorStop(1, timeOfDay === 'night' ? '#0a2a0a' : '#2E7D32');
            }
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, H - 80, W, 80);

            // Ground details
            if (locationType === 'forest') {
                ctx.fillStyle = timeOfDay === 'night' ? '#0a2a0a' : '#388E3C';
                for (var i = 0; i < 20; i++) {
                    var gx = ((i * 28 + groundOffset) % (W + 20)) - 10;
                    ctx.beginPath();
                    ctx.moveTo(gx, H - 80);
                    ctx.lineTo(gx + 4, H - 90);
                    ctx.lineTo(gx + 8, H - 80);
                    ctx.closePath();
                    ctx.fill();
                }
                // Stream
                ctx.strokeStyle = timeOfDay === 'night' ? 'rgba(100,150,255,0.3)' : 'rgba(100,200,255,0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, H - 50);
                for (var sx = 0; sx < W; sx += 10) {
                    ctx.lineTo(sx, H - 50 + Math.sin((sx + frameCount * 2) * 0.05) * 3);
                }
                ctx.stroke();
            } else {
                ctx.fillStyle = timeOfDay === 'night' ? '#555' : '#888';
                for (var i = 0; i < 15; i++) {
                    var rx = ((i * 40 + groundOffset * 2) % (W + 40)) - 20;
                    ctx.fillRect(rx, H - 50, 20, 3);
                }
            }
        }

        function drawBird(b) {
            ctx.save();
            ctx.translate(b.x, b.y);
            var rotation = Math.min(Math.max(b.vy * 3, -30), 45) * Math.PI / 180;
            ctx.rotate(rotation);
            var s = b.size;
            var birdType = b.type;

            if (invincibleTimer > 0 && Math.floor(frameCount / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            if (birdType === 'pigeon') {
                // Body
                ctx.fillStyle = '#8899aa';
                drawEllipse(0, 0, s * 1.1, s * 0.85);
                // Belly
                ctx.fillStyle = '#aabbcc';
                drawEllipse(3, 4, s * 0.6, s * 0.5);
                // Wing
                ctx.fillStyle = '#667788';
                var wingFlap = Math.sin(frameCount * 0.1) * 8;
                drawEllipse(-5, -2 + wingFlap, s * 0.5, s * 0.7);
                // Head
                ctx.fillStyle = '#778899';
                ctx.beginPath();
                ctx.arc(s * 0.7, -s * 0.3, s * 0.5, 0, Math.PI * 2);
                ctx.fill();
                // Eye
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s * 0.9, -s * 0.4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(s * 0.95, -s * 0.4, 2.5, 0, Math.PI * 2);
                ctx.fill();
                // Beak
                ctx.fillStyle = '#ff9800';
                ctx.beginPath();
                ctx.moveTo(s * 1.1, -s * 0.25);
                ctx.lineTo(s * 1.5, -s * 0.15);
                ctx.lineTo(s * 1.1, -s * 0.05);
                ctx.closePath();
                ctx.fill();
                // Neck shimmer
                ctx.fillStyle = 'rgba(100, 200, 150, 0.4)';
                ctx.beginPath();
                ctx.arc(s * 0.5, -s * 0.1, s * 0.3, 0, Math.PI * 2);
                ctx.fill();
            } else if (birdType === 'tit') {
                // Body
                ctx.fillStyle = '#FFD740';
                drawEllipse(0, 0, s * 0.9, s * 0.75);
                // Belly
                ctx.fillStyle = '#FFF9C4';
                drawEllipse(2, 4, s * 0.5, s * 0.45);
                // Black stripe
                ctx.fillStyle = '#333';
                drawEllipse(0, -2, s * 0.15, s * 0.6);
                // Wing
                ctx.fillStyle = '#4FC3F7';
                var wingFlap = Math.sin(frameCount * 0.12) * 10;
                drawEllipse(-4, -2 + wingFlap, s * 0.4, s * 0.6);
                // Head
                ctx.fillStyle = '#1565C0';
                ctx.beginPath();
                ctx.arc(s * 0.6, -s * 0.35, s * 0.45, 0, Math.PI * 2);
                ctx.fill();
                // White cheek
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s * 0.7, -s * 0.2, s * 0.2, 0, Math.PI * 2);
                ctx.fill();
                // Eye
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s * 0.75, -s * 0.4, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(s * 0.78, -s * 0.4, 2, 0, Math.PI * 2);
                ctx.fill();
                // Beak
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(s * 0.95, -s * 0.3);
                ctx.lineTo(s * 1.3, -s * 0.25);
                ctx.lineTo(s * 0.95, -s * 0.15);
                ctx.closePath();
                ctx.fill();
            } else {
                // Swallow - sleek body
                ctx.fillStyle = '#1A237E';
                drawEllipse(0, 0, s * 0.8, s * 0.5);
                // Belly
                ctx.fillStyle = '#FFCCBC';
                drawEllipse(2, 3, s * 0.45, s * 0.35);
                // Wings
                ctx.fillStyle = '#283593';
                var wingFlap = Math.sin(frameCount * 0.15) * 12;
                ctx.beginPath();
                ctx.moveTo(-3, 0);
                ctx.lineTo(-s * 1.2, -s * 0.8 + wingFlap);
                ctx.lineTo(-s * 0.3, -s * 0.1);
                ctx.closePath();
                ctx.fill();
                // Head
                ctx.fillStyle = '#1A237E';
                ctx.beginPath();
                ctx.arc(s * 0.55, -s * 0.15, s * 0.35, 0, Math.PI * 2);
                ctx.fill();
                // Red throat
                ctx.fillStyle = '#D32F2F';
                ctx.beginPath();
                ctx.arc(s * 0.5, s * 0.05, s * 0.15, 0, Math.PI * 2);
                ctx.fill();
                // Eye
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s * 0.65, -s * 0.2, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(s * 0.68, -s * 0.2, 1.8, 0, Math.PI * 2);
                ctx.fill();
                // Beak
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(s * 0.8, -s * 0.15);
                ctx.lineTo(s * 1.2, -s * 0.1);
                ctx.lineTo(s * 0.8, -s * 0.02);
                ctx.closePath();
                ctx.fill();
                // Tail fork
                ctx.fillStyle = '#1A237E';
                ctx.beginPath();
                ctx.moveTo(-s * 0.7, 0);
                ctx.lineTo(-s * 1.3, -s * 0.3);
                ctx.lineTo(-s * 0.9, 0);
                ctx.lineTo(-s * 1.3, s * 0.3);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function drawObstacle(obs) {
            var gapY = obs.gapY;
            var gapH = obs.gapH;

            if (locationType === 'city') {
                var buildColor = timeOfDay === 'night' ? '#2a3a4a' : '#78909C';
                var buildColorDark = timeOfDay === 'night' ? '#1a2a3a' : '#546E7A';
                // Top
                ctx.fillStyle = buildColor;
                ctx.fillRect(obs.x, 0, obs.width, gapY - gapH / 2);
                ctx.fillStyle = buildColorDark;
                ctx.fillRect(obs.x, gapY - gapH / 2 - 15, obs.width + 8, 15);
                if (timeOfDay === 'night') {
                    var seed = Math.floor(obs.x * 7.3);
                    for (var wy = 10; wy < gapY - gapH/2 - 20; wy += 20) {
                        var h1 = ((seed + wy * 13) * 2654435761) >>> 0;
                        var h2 = ((seed + wy * 17 + 999) * 2654435761) >>> 0;
                        ctx.fillStyle = (h1 % 100 < 50) ? '#FFE082' : '#1a2a3a';
                        ctx.fillRect(obs.x + 5, wy, 10, 12);
                        ctx.fillStyle = (h2 % 100 < 50) ? '#FFE082' : '#1a2a3a';
                        ctx.fillRect(obs.x + obs.width - 15, wy, 10, 12);
                    }
                }
                // Bottom
                ctx.fillStyle = buildColor;
                ctx.fillRect(obs.x, gapY + gapH / 2, obs.width, H - gapY - gapH / 2);
                ctx.fillStyle = buildColorDark;
                ctx.fillRect(obs.x, gapY + gapH / 2, obs.width + 8, 15);
                if (timeOfDay === 'night') {
                    var seed = Math.floor(obs.x * 11.7);
                    for (var wy = gapY + gapH/2 + 20; wy < H - 80; wy += 20) {
                        var h1 = ((seed + wy * 13) * 2654435761) >>> 0;
                        var h2 = ((seed + wy * 17 + 999) * 2654435761) >>> 0;
                        ctx.fillStyle = (h1 % 100 < 50) ? '#FFE082' : '#1a2a3a';
                        ctx.fillRect(obs.x + 5, wy, 10, 12);
                        ctx.fillStyle = (h2 % 100 < 50) ? '#FFE082' : '#1a2a3a';
                        ctx.fillRect(obs.x + obs.width - 15, wy, 10, 12);
                    }
                }
            } else {
                var trunkColor = timeOfDay === 'night' ? '#3E2723' : '#5D4037';
                var trunkColorDark = timeOfDay === 'night' ? '#2a1a10' : '#4E342E';
                // Top trunk
                ctx.fillStyle = trunkColor;
                ctx.fillRect(obs.x + 5, 0, obs.width - 10, gapY - gapH / 2);
                ctx.fillStyle = trunkColorDark;
                for (var ty = 0; ty < gapY - gapH/2; ty += 15) {
                    ctx.fillRect(obs.x + 8, ty, 5, 8);
                }
                ctx.fillStyle = timeOfDay === 'night' ? '#1a3a1a' : '#2E7D32';
                ctx.beginPath();
                ctx.arc(obs.x + obs.width/2, gapY - gapH/2, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(obs.x + obs.width/2 - 15, gapY - gapH/2 + 5, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(obs.x + obs.width/2 + 15, gapY - gapH/2 + 5, 18, 0, Math.PI * 2);
                ctx.fill();
                // Bottom trunk
                ctx.fillStyle = trunkColor;
                ctx.fillRect(obs.x + 5, gapY + gapH / 2, obs.width - 10, H - gapY - gapH / 2);
                ctx.fillStyle = trunkColorDark;
                for (var ty = gapY + gapH/2; ty < H - 80; ty += 15) {
                    ctx.fillRect(obs.x + 8, ty, 5, 8);
                }
                ctx.fillStyle = timeOfDay === 'night' ? '#1a3a1a' : '#2E7D32';
                ctx.beginPath();
                ctx.arc(obs.x + obs.width/2, gapY + gapH/2, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(obs.x + obs.width/2 - 15, gapY + gapH/2 - 5, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(obs.x + obs.width/2 + 15, gapY + gapH/2 - 5, 18, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawWorm(w) {
            ctx.save();
            ctx.translate(w.x, w.y);
            var wiggle = Math.sin(frameCount * 0.1 + w.x) * 3;
            var segCount = w.size === 'small' ? 4 : w.size === 'medium' ? 6 : 8;
            var segSize = w.size === 'small' ? 4 : w.size === 'medium' ? 5 : 7;
            var totalLen = segCount * segSize * 1.2;
            var colors = {
                1: { body: '#FFD54F', outline: '#F9A825' },
                2: { body: '#66BB6A', outline: '#2E7D32' },
                3: { body: '#EF5350', outline: '#C62828' }
            };
            var c = colors[w.points];

            for (var i = segCount - 1; i >= 0; i--) {
                var sx = -totalLen/2 + i * segSize * 1.2;
                var sy = Math.sin(frameCount * 0.15 + i * 0.8) * (3 + wiggle);
                ctx.fillStyle = c.body;
                ctx.strokeStyle = c.outline;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(sx, sy, segSize - i * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
            // Head
            var headX = totalLen/2;
            var headY = Math.sin(frameCount * 0.15) * 3;
            ctx.fillStyle = c.body;
            ctx.strokeStyle = c.outline;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(headX, headY, segSize + 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(headX + 2, headY - 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(headX + 3, headY - 3, 1.5, 0, Math.PI * 2);
            ctx.fill();
            // Smile
            ctx.strokeStyle = c.outline;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(headX + 2, headY + 1, 3, 0, Math.PI);
            ctx.stroke();
            ctx.restore();
        }

        function createObstacle() {
            var gapH = 140 - gameSpeed * 5;
            if (gapH < 100) gapH = 100;
            var gapY = Math.random() * (H - 200) + 100;
            obstacles.push({
                x: W + 50,
                width: 55,
                gapY: gapY,
                gapH: gapH,
                passed: false
            });
        }

        function createWorm() {
            var sizes = ['small', 'medium', 'big'];
            var points = [1, 2, 3];
            var idx = Math.floor(Math.random() * 3);
            worms.push({
                x: W + 30,
                y: Math.random() * (H - 200) + 100,
                size: sizes[idx],
                points: points[idx],
                collected: false
            });
        }

        function addParticles(x, y, color, count) {
            for (var i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30 + Math.random() * 20,
                    maxLife: 50,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function addScorePopup(x, y, text) {
            scorePopups.push({ x: x, y: y, text: text, life: 60, vy: -2 });
        }

        function initGame() {
            var birdConfig = BIRDS[selectedBird];
            bird = {
                x: 80, y: H / 2, vy: 0,
                size: birdConfig.size,
                type: selectedBird,
                flapForce: birdConfig.flapForce
            };
            obstacles = [];
            worms = [];
            particles = [];
            scorePopups = [];
            score = 0;
            lives = 3;
            gameSpeed = 1;
            spawnTimer = 0;
            wormTimer = 0;
            groundOffset = 0;
            invincibleTimer = 0;
            shakeTimer = 0;
            newRecord = false;
            generateBackground();
        }



        function update() {
            if (gameState !== STATE_PLAYING) return;
            groundOffset -= BIRDS[selectedBird].speed * gameSpeed;
            spawnTimer++;
            wormTimer++;

            // Bird movement based on key presses
            var moveSpeed = 4;
            if (keysDown['ArrowUp']) {
                bird.y -= moveSpeed;
                bird.vy = -moveSpeed;
            } else if (keysDown['ArrowDown']) {
                bird.y += moveSpeed;
                bird.vy = moveSpeed;
            } else {
                bird.vy = 0;
            }

            if (bird.y - bird.size < 0) {
                bird.y = bird.size;
                bird.vy = 0;
            }
            if (bird.y + bird.size > H - 80) {
                bird.y = H - 80 - bird.size;
                bird.vy = 0;
            }

            var spawnRate = Math.max(80, 140 - gameSpeed * 12);
            if (spawnTimer % Math.floor(spawnRate) === 0) createObstacle();
            if (wormTimer % Math.floor(spawnRate * 0.6) === 0) {
                if (Math.random() < 0.55) createWorm();
            }

            var speed = BIRDS[selectedBird].speed * gameSpeed;
            for (var oi = 0; oi < obstacles.length; oi++) {
                var obs = obstacles[oi];
                obs.x -= speed;
                if (!obs.passed && obs.x + obs.width < bird.x) obs.passed = true;
                if (invincibleTimer <= 0) {
                    var bL = bird.x - bird.size * 0.7;
                    var bR = bird.x + bird.size * 0.7;
                    var bT = bird.y - bird.size * 0.6;
                    var bB = bird.y + bird.size * 0.6;
                    if (bR > obs.x && bL < obs.x + obs.width) {
                        if (bT < obs.gapY - obs.gapH / 2 || bB > obs.gapY + obs.gapH / 2) {
                            loseLife();
                        }
                    }
                }
            }

            for (var wi = 0; wi < worms.length; wi++) {
                var w = worms[wi];
                w.x -= speed;
                if (!w.collected) {
                    var dx = bird.x - w.x;
                    var dy = bird.y - w.y;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    var collectDist = w.size === 'small' ? 20 : w.size === 'medium' ? 25 : 30;
                    if (dist < collectDist + bird.size * 0.5) {
                        w.collected = true;
                        score += w.points;
                        var pColors = { 1: '#FFD54F', 2: '#66BB6A', 3: '#EF5350' };
                        addParticles(w.x, w.y, pColors[w.points], 8);
                        addScorePopup(w.x, w.y, '+' + w.points);
                    }
                }
            }

            obstacles = obstacles.filter(function(o) { return o.x > -100; });
            worms = worms.filter(function(w) { return w.x > -50 && !w.collected; });

            for (var pi = 0; pi < particles.length; pi++) {
                var p = particles[pi];
                p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
            }
            particles = particles.filter(function(p) { return p.life > 0; });

            for (var si = 0; si < scorePopups.length; si++) {
                scorePopups[si].y += scorePopups[si].vy;
                scorePopups[si].life--;
            }
            scorePopups = scorePopups.filter(function(p) { return p.life > 0; });

            if (invincibleTimer > 0) invincibleTimer--;
            if (shakeTimer > 0) shakeTimer--;
        }

        function loseLife() {
            lives--;
            invincibleTimer = 90;
            shakeTimer = 15;
            addParticles(bird.x, bird.y, '#ff4444', 12);
            if (lives <= 0) gameOver();
        }

        function gameOver() {
            gameState = STATE_GAMEOVER;
            prevHighScore = highScore;
            if (score > highScore) {
                highScore = score;
                newRecord = true;
                try { localStorage.setItem('wormyWingsHighScore', highScore); } catch(e) {}
            }
        }

        function drawHUD() {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            roundRect(10, 10, 120, 40, 10);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Comic Sans MS, cursive';
            ctx.textAlign = 'left';
            ctx.fillText('Score: ' + score, 20, 37);

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            roundRect(W - 110, 10, 100, 40, 10);
            ctx.fill();
            for (var i = 0; i < lives; i++) {
                ctx.fillStyle = '#EF5350';
                ctx.font = '22px serif';
                ctx.fillText('\u2764', W - 100 + i * 30, 37);
            }



            for (var i = 0; i < scorePopups.length; i++) {
                var p = scorePopups[i];
                var alpha = p.life / 60;
                ctx.fillStyle = 'rgba(255, 255, 100, ' + alpha + ')';
                ctx.font = 'bold 18px Comic Sans MS, cursive';
                ctx.textAlign = 'center';
                ctx.fillText(p.text, p.x, p.y);
            }
        }

        function drawMenu() {
            drawBackground();
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, W, H);

            ctx.save();
            ctx.shadowColor = '#FFD740';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#FFD740';
            ctx.font = 'bold 36px Comic Sans MS, cursive';
            ctx.textAlign = 'center';
            ctx.fillText('Wormy Wings', W/2, 80);
            ctx.restore();

            ctx.fillStyle = '#fff';
            ctx.font = '16px Comic Sans MS, cursive';
            ctx.textAlign = 'center';
            ctx.fillText('\u041F\u0442\u0438\u0447\u0438\u0439 \u043F\u0438\u0440', W/2, 110);

            if (highScore > 0) {
                ctx.fillStyle = '#FFD740';
                ctx.font = '14px Comic Sans MS, cursive';
                ctx.fillText('\u0420\u0435\u043A\u043E\u0440\u0434: ' + highScore, W/2, 140);
            }

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 18px Comic Sans MS, cursive';
            ctx.fillText('\u0412\u044B\u0431\u0435\u0440\u0438 \u043F\u0442\u0438\u0447\u043A\u0443:', W/2, 185);

            var birdKeys = ['pigeon', 'tit', 'swallow'];
            var birdNames = ['\u0413\u043E\u043B\u0443\u0431\u044C', '\u0421\u0438\u043D\u0438\u0447\u043A\u0430', '\u041B\u0430\u0441\u0442\u043E\u0447\u043A\u0430'];
            var birdDiff = ['\u2B50', '\u2B50\u2B50', '\u2B50\u2B50\u2B50'];

            for (var i = 0; i < 3; i++) {
                var y = 220 + i * 80;
                var isSelected = menuSelection === i;
                ctx.fillStyle = isSelected ? 'rgba(255, 215, 0, 0.3)' : 'rgba(255,255,255,0.1)';
                ctx.strokeStyle = isSelected ? '#FFD740' : 'rgba(255,255,255,0.3)';
                ctx.lineWidth = isSelected ? 3 : 1;
                roundRect(W/2 - 140, y - 25, 280, 60, 15);
                ctx.fill();
                ctx.stroke();

                var tempBird = { x: W/2 - 80, y: y + 5, size: BIRDS[birdKeys[i]].size, type: birdKeys[i], vy: 0 };
                drawBird(tempBird);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Comic Sans MS, cursive';
                ctx.textAlign = 'left';
                ctx.fillText(birdNames[i], W/2 - 40, y);
                ctx.fillStyle = '#FFD740';
                ctx.font = '14px Comic Sans MS, cursive';
                ctx.fillText(birdDiff[i], W/2 - 40, y + 20);
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#aaa';
            ctx.font = '14px Comic Sans MS, cursive';
            ctx.fillText('\u2191\u2193 \u2014 \u0432\u044B\u0431\u043E\u0440, Enter \u2014 \u043D\u0430\u0447\u0430\u0442\u044C', W/2, H - 60);
            ctx.fillText('\u0438\u043B\u0438 \u043D\u0430\u0436\u043C\u0438 \u043D\u0430 \u043F\u0442\u0438\u0447\u043A\u0443 \u043C\u044B\u0448\u043A\u043E\u0439', W/2, H - 38);
            ctx.fillStyle = '#888';
            ctx.font = '12px Comic Sans MS, cursive';
            ctx.fillText('\u2191\u2193 \u2014 \u0443\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u043F\u0442\u0438\u0446\u0435\u0439', W/2, H - 15);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(30, 30, 60, 0.95)';
            ctx.strokeStyle = '#FFD740';
            ctx.lineWidth = 3;
            roundRect(W/2 - 160, H/2 - 150, 320, 340, 20);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#EF5350';
            ctx.font = 'bold 28px Comic Sans MS, cursive';
            ctx.textAlign = 'center';
            ctx.fillText('\u0418\u0433\u0440\u0430 \u043E\u043A\u043E\u043D\u0447\u0435\u043D\u0430!', W/2, H/2 - 100);

            ctx.fillStyle = '#fff';
            ctx.font = '20px Comic Sans MS, cursive';
            ctx.fillText('\u041E\u0447\u043A\u0438: ' + score, W/2, H/2 - 50);

            ctx.fillStyle = '#FFD740';
            ctx.font = '16px Comic Sans MS, cursive';
            ctx.fillText('\u0420\u0435\u043A\u043E\u0440\u0434: ' + highScore, W/2, H/2 - 15);

            if (newRecord) {
                ctx.save();
                ctx.shadowColor = '#FFD740';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#FFD740';
                ctx.font = 'bold 22px Comic Sans MS, cursive';
                var pulse = 1 + Math.sin(frameCount * 0.1) * 0.05;
                ctx.save();
                ctx.translate(W/2, H/2 + 25);
                ctx.scale(pulse, pulse);
                ctx.fillText('\u041D\u043E\u0432\u044B\u0439 \u0440\u0435\u043A\u043E\u0440\u0434!', 0, 0);
                ctx.restore();
                ctx.restore();
            } else if (score > 0 && prevHighScore > 0) {
                ctx.fillStyle = '#aaa';
                ctx.font = '14px Comic Sans MS, cursive';
                ctx.fillText('\u0414\u043E \u0440\u0435\u043A\u043E\u0440\u0434\u0430: ' + (highScore - score), W/2, H/2 + 25);
            }

            ctx.fillStyle = '#ccc';
            ctx.font = '14px Comic Sans MS, cursive';
            ctx.fillText('\u041F\u0442\u0438\u0447\u043A\u0430: ' + BIRDS[selectedBird].name, W/2, H/2 + 60);

            var btnY = H/2 + 90;
            ctx.fillStyle = '#4CAF50';
            roundRect(W/2 - 80, btnY, 160, 40, 12);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px Comic Sans MS, cursive';
            ctx.fillText('\u0418\u0433\u0440\u0430\u0442\u044C \u0441\u043D\u043E\u0432\u0430', W/2, btnY + 25);

            var btnMenuY = btnY + 50;
            ctx.fillStyle = '#5C6BC0';
            roundRect(W/2 - 80, btnMenuY, 160, 40, 12);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px Comic Sans MS, cursive';
            ctx.fillText('\u0412 \u043C\u0435\u043D\u044E', W/2, btnMenuY + 25);
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            if (shakeTimer > 0 && gameState === STATE_PLAYING) {
                ctx.translate(
                    (Math.random() - 0.5) * shakeTimer,
                    (Math.random() - 0.5) * shakeTimer
                );
            }

            if (gameState === STATE_MENU) {
                drawMenu();
            } else {
                drawBackground();
                for (var i = 0; i < worms.length; i++) {
                    if (!worms[i].collected) drawWorm(worms[i]);
                }
                for (var i = 0; i < obstacles.length; i++) {
                    drawObstacle(obstacles[i]);
                }
                if (bird) drawBird(bird);
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    var alpha = p.life / p.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                drawHUD();
                if (gameState === STATE_GAMEOVER) drawGameOver();
            }
            ctx.restore();
        }

        function gameLoop() {
            frameCount++;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', function(e) {
            keysDown[e.key] = true;
            
            if (gameState === STATE_MENU) {
                if (e.key === 'ArrowUp') {
                    menuSelection = (menuSelection - 1 + 3) % 3;
                } else if (e.key === 'ArrowDown') {
                    menuSelection = (menuSelection + 1) % 3;
                } else if (e.key === 'Enter' || e.key === ' ') {
                    selectedBird = ['pigeon', 'tit', 'swallow'][menuSelection];
                    initGame();
                    gameState = STATE_PLAYING;
                }
            } else if (gameState === STATE_PLAYING) {
                if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    e.preventDefault();
                }
            } else if (gameState === STATE_GAMEOVER) {
                if (e.key === 'Enter' || e.key === ' ') {
                    initGame();
                    gameState = STATE_PLAYING;
                } else if (e.key === 'm' || e.key === 'M') {
                    gameState = STATE_MENU;
                }
            }
        });

        document.addEventListener('keyup', function(e) {
            keysDown[e.key] = false;
        });

        canvas.addEventListener('click', function(e) {
            var rect = canvas.getBoundingClientRect();
            var scaleX = W / rect.width;
            var scaleY = H / rect.height;
            var mx = (e.clientX - rect.left) * scaleX;
            var my = (e.clientY - rect.top) * scaleY;

            if (gameState === STATE_MENU) {
                var birdKeys = ['pigeon', 'tit', 'swallow'];
                for (var i = 0; i < 3; i++) {
                    var y = 220 + i * 80;
                    if (mx > W/2 - 140 && mx < W/2 + 140 && my > y - 25 && my < y + 35) {
                        menuSelection = i;
                        selectedBird = birdKeys[i];
                        initGame();
                        gameState = STATE_PLAYING;
                    }
                }
            } else if (gameState === STATE_PLAYING) {
                // No action on click during gameplay
            } else if (gameState === STATE_GAMEOVER) {
                var btnY = H/2 + 90;
                if (mx > W/2 - 80 && mx < W/2 + 80 && my > btnY && my < btnY + 40) {
                    initGame();
                    gameState = STATE_PLAYING;
                }
                var btnMenuY = btnY + 50;
                if (mx > W/2 - 80 && mx < W/2 + 80 && my > btnMenuY && my < btnMenuY + 40) {
                    gameState = STATE_MENU;
                }
            }
        });

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (gameState === STATE_GAMEOVER) {
                initGame();
                gameState = STATE_PLAYING;
            }
        });

        generateBackground();
        gameLoop();

    } catch(e) {
        document.body.innerHTML = '<div style="color:white;padding:20px;font-family:monospace;"><h2>Error:</h2><pre>' + e.message + '\n' + e.stack + '</pre></div>';
    }
    </script>
</body>
</html>
