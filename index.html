<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wormy Wings — Птичий пир</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 80px rgba(100,100,255,0.1);
            max-width: 100vw;
            max-height: 100vh;
        }
        canvas {
            display: block;
            cursor: pointer;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Responsive canvas
    const W = 480;
    const H = 640;
    canvas.width = W;
    canvas.height = H;

    // Helper function for rounded rectangles
    function drawRoundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // Game states
    const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
    let gameState = STATE.MENU;

    // Bird types
    const BIRDS = {
        pigeon: { name: 'Голубь', difficulty: 1, speed: 3, size: 28, color: '#8899aa', desc: 'Толстый, медленный', flapForce: -7 },
        tit: { name: 'Синичка', difficulty: 2, speed: 4.5, size: 22, color: '#ffdd44', desc: 'Маленькая, средняя', flapForce: -8 },
        swallow: { name: 'Ласточка', difficulty: 3, speed: 6.5, size: 18, color: '#2244aa', desc: 'Очень быстрая', flapForce: -9 }
    };

    // Game variables
    let selectedBird = null;
    let bird = null;
    let obstacles = [];
    let worms = [];
    let particles = [];
    let score = 0;
    let lives = 3;
    let gameSpeed = 1;
    let frameCount = 0;
    let spawnTimer = 0;
    let wormTimer = 0;
    let highScore = parseInt(localStorage.getItem('wormyWingsHighScore')) || 0;
    let prevHighScore = highScore;
    let newRecord = false;
    let location = null; // 'city' or 'forest'
    let timeOfDay = null; // 'day' or 'night'
    let menuSelection = 0;
    let stars = [];
    let clouds = [];
    let bgElements = [];
    let groundOffset = 0;
    let shakeTimer = 0;
    let invincibleTimer = 0;
    let scorePopups = [];

    // Generate background elements
    function generateBackground() {
        location = Math.random() < 0.5 ? 'city' : 'forest';
        timeOfDay = Math.random() < 0.5 ? 'day' : 'night';
        
        stars = [];
        clouds = [];
        bgElements = [];

        if (timeOfDay === 'night') {
            for (let i = 0; i < 60; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H * 0.6,
                    size: Math.random() * 2.5 + 0.5,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        } else {
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * W,
                    y: Math.random() * H * 0.35 + 20,
                    size: Math.random() * 40 + 30,
                    speed: Math.random() * 0.3 + 0.1
                });
            }
        }

        if (location === 'city') {
            for (let i = 0; i < 8; i++) {
                bgElements.push({
                    x: i * 70 + Math.random() * 20,
                    height: Math.random() * 120 + 60,
                    width: Math.random() * 40 + 30,
                    color: `hsl(${Math.random() * 30 + 200}, 20%, ${Math.random() * 20 + 30}%)`,
                    windows: Math.floor(Math.random() * 4 + 2),
                    windowLit: Array.from({length: 10}, () => Math.random() < 0.55)
                });
            }
        } else {
            for (let i = 0; i < 12; i++) {
                bgElements.push({
                    x: i * 45 + Math.random() * 20,
                    height: Math.random() * 80 + 40,
                    type: Math.random() < 0.5 ? 'pine' : 'leaf',
                    color: Math.random() < 0.5 ? `hsl(${120 + Math.random()*40}, 50%, ${25 + Math.random()*15}%)` : `hsl(${80 + Math.random()*30}, 40%, ${30 + Math.random()*15}%)`
                });
            }
        }
    }

    // Draw background
    function drawBackground() {
        // Sky gradient
        let skyGrad;
        if (timeOfDay === 'day') {
            skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            skyGrad.addColorStop(0, '#87CEEB');
            skyGrad.addColorStop(0.6, '#B0E0FF');
            skyGrad.addColorStop(1, '#E8F5E9');
        } else {
            skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            skyGrad.addColorStop(0, '#0a0a2a');
            skyGrad.addColorStop(0.5, '#1a1a4a');
            skyGrad.addColorStop(1, '#2a2a3a');
        }
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // Stars (night)
        if (timeOfDay === 'night') {
            stars.forEach(s => {
                s.twinkle += 0.03;
                let alpha = 0.5 + Math.sin(s.twinkle) * 0.5;
                ctx.fillStyle = `rgba(255, 255, 220, ${alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            // Moon
            ctx.fillStyle = '#FFFDE7';
            ctx.beginPath();
            ctx.arc(380, 70, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = timeOfDay === 'night' ? '#1a1a4a' : '#87CEEB';
            ctx.beginPath();
            ctx.arc(395, 60, 30, 0, Math.PI * 2);
            ctx.fill();
            // Moon glow
            let moonGlow = ctx.createRadialGradient(380, 70, 30, 380, 70, 80);
            moonGlow.addColorStop(0, 'rgba(255,255,200,0.15)');
            moonGlow.addColorStop(1, 'rgba(255,255,200,0)');
            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(380, 70, 80, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // Sun
            let sunGlow = ctx.createRadialGradient(80, 60, 20, 80, 60, 70);
            sunGlow.addColorStop(0, 'rgba(255,255,100,0.8)');
            sunGlow.addColorStop(0.5, 'rgba(255,200,50,0.3)');
            sunGlow.addColorStop(1, 'rgba(255,200,50,0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(80, 60, 70, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFE44D';
            ctx.beginPath();
            ctx.arc(80, 60, 25, 0, Math.PI * 2);
            ctx.fill();

            // Clouds
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x < -80) c.x = W + 80;
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size * 0.5, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.3, c.y - c.size * 0.15, c.size * 0.4, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.6, c.y, c.size * 0.45, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.3, c.y + c.size * 0.1, c.size * 0.35, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Background elements (city/forest)
        if (location === 'city') {
            bgElements.forEach(b => {
                let baseY = H - 80;
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, baseY - b.height, b.width, b.height);
                // Roof
                ctx.fillStyle = timeOfDay === 'night' ? '#333' : '#666';
                ctx.fillRect(b.x - 3, baseY - b.height - 5, b.width + 6, 8);
                // Windows
                if (timeOfDay === 'night') {
                    let wi = 0;
                    for (let wy = 0; wy < b.windows; wy++) {
                        for (let wx = 0; wx < 2; wx++) {
                            let lit = b.windowLit && b.windowLit[wi % b.windowLit.length];
                            ctx.fillStyle = lit ? '#FFE082' : '#222';
                            ctx.fillRect(b.x + 5 + wx * (b.width/2 - 2), baseY - b.height + 15 + wy * 22, 8, 10);
                            wi++;
                        }
                    }
                } else {
                    for (let wy = 0; wy < b.windows; wy++) {
                        for (let wx = 0; wx < 2; wx++) {
                            ctx.fillStyle = '#B3E5FC';
                            ctx.fillRect(b.x + 5 + wx * (b.width/2 - 2), baseY - b.height + 15 + wy * 22, 8, 10);
                        }
                    }
                }
            });
        } else {
            bgElements.forEach(b => {
                let baseY = H - 80;
                // Trunk
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(b.x + 8, baseY - b.height * 0.4, 8, b.height * 0.4);
                // Foliage
                ctx.fillStyle = b.color;
                if (b.type === 'pine') {
                    ctx.beginPath();
                    ctx.moveTo(b.x + 12, baseY - b.height);
                    ctx.lineTo(b.x - 5, baseY - b.height * 0.3);
                    ctx.lineTo(b.x + 29, baseY - b.height * 0.3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(b.x + 12, baseY - b.height * 0.75);
                    ctx.lineTo(b.x - 8, baseY - b.height * 0.15);
                    ctx.lineTo(b.x + 32, baseY - b.height * 0.15);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(b.x + 12, baseY - b.height * 0.6, b.height * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + 5, baseY - b.height * 0.5, b.height * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + 20, baseY - b.height * 0.5, b.height * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // Ground
        let groundGrad = ctx.createLinearGradient(0, H - 80, 0, H);
        if (location === 'city') {
            groundGrad.addColorStop(0, timeOfDay === 'night' ? '#333' : '#666');
            groundGrad.addColorStop(1, timeOfDay === 'night' ? '#222' : '#444');
        } else {
            groundGrad.addColorStop(0, timeOfDay === 'night' ? '#1a3a1a' : '#4CAF50');
            groundGrad.addColorStop(1, timeOfDay === 'night' ? '#0a2a0a' : '#2E7D32');
        }
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, H - 80, W, 80);

        // Ground details
        if (location === 'forest') {
            ctx.fillStyle = timeOfDay === 'night' ? '#0a2a0a' : '#388E3C';
            for (let i = 0; i < 20; i++) {
                let gx = ((i * 28 + groundOffset) % (W + 20)) - 10;
                ctx.beginPath();
                ctx.moveTo(gx, H - 80);
                ctx.lineTo(gx + 4, H - 90);
                ctx.lineTo(gx + 8, H - 80);
                ctx.fill();
            }
            // Stream
            ctx.strokeStyle = timeOfDay === 'night' ? 'rgba(100,150,255,0.3)' : 'rgba(100,200,255,0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, H - 50);
            for (let sx = 0; sx < W; sx += 10) {
                ctx.lineTo(sx, H - 50 + Math.sin((sx + frameCount * 2) * 0.05) * 3);
            }
            ctx.stroke();
        } else {
            // Road markings
            ctx.fillStyle = timeOfDay === 'night' ? '#555' : '#888';
            for (let i = 0; i < 15; i++) {
                let rx = ((i * 40 + groundOffset * 2) % (W + 40)) - 20;
                ctx.fillRect(rx, H - 50, 20, 3);
            }
        }
    }

    // Draw bird
    function drawBird(b) {
        ctx.save();
        ctx.translate(b.x, b.y);
        
        let rotation = Math.min(Math.max(b.vy * 3, -30), 45) * Math.PI / 180;
        ctx.rotate(rotation);

        let s = b.size;
        let birdType = b.type;

        // Invincibility flash
        if (invincibleTimer > 0 && Math.floor(frameCount / 4) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }

        if (birdType === 'pigeon') {
            // Body - round and chubby
            ctx.fillStyle = '#8899aa';
            ctx.beginPath();
            ctx.ellipse(0, 0, s * 1.1, s * 0.85, 0, 0, Math.PI * 2);
            ctx.fill();
            // Belly
            ctx.fillStyle = '#aabbcc';
            ctx.beginPath();
            ctx.ellipse(3, 4, s * 0.6, s * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            // Wing
            ctx.fillStyle = '#667788';
            let wingFlap = Math.sin(frameCount * 0.3) * 8;
            ctx.beginPath();
            ctx.ellipse(-5, -2 + wingFlap, s * 0.5, s * 0.7, -0.3, 0, Math.PI * 2);
            ctx.fill();
            // Head
            ctx.fillStyle = '#778899';
            ctx.beginPath();
            ctx.arc(s * 0.7, -s * 0.3, s * 0.5, 0, Math.PI * 2);
            ctx.fill();
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(s * 0.9, -s * 0.4, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(s * 0.95, -s * 0.4, 2.5, 0, Math.PI * 2);
            ctx.fill();
            // Beak
            ctx.fillStyle = '#ff9800';
            ctx.beginPath();
            ctx.moveTo(s * 1.1, -s * 0.25);
            ctx.lineTo(s * 1.5, -s * 0.15);
            ctx.lineTo(s * 1.1, -s * 0.05);
            ctx.closePath();
            ctx.fill();
            // Neck shimmer (green/purple pigeon)
            ctx.fillStyle = 'rgba(100, 200, 150, 0.4)';
            ctx.beginPath();
            ctx.arc(s * 0.5, -s * 0.1, s * 0.3, 0, Math.PI * 2);
            ctx.fill();
        } else if (birdType === 'tit') {
            // Body - small and round
            ctx.fillStyle = '#FFD740';
            ctx.beginPath();
            ctx.ellipse(0, 0, s * 0.9, s * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();
            // Belly
            ctx.fillStyle = '#FFF9C4';
            ctx.beginPath();
            ctx.ellipse(2, 4, s * 0.5, s * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();
            // Black stripe
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(0, -2, s * 0.15, s * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            // Wing
            ctx.fillStyle = '#4FC3F7';
            let wingFlap = Math.sin(frameCount * 0.4) * 10;
            ctx.beginPath();
            ctx.ellipse(-4, -2 + wingFlap, s * 0.4, s * 0.6, -0.3, 0, Math.PI * 2);
            ctx.fill();
            // Head
            ctx.fillStyle = '#1565C0';
            ctx.beginPath();
            ctx.arc(s * 0.6, -s * 0.35, s * 0.45, 0, Math.PI * 2);
            ctx.fill();
            // White cheek
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(s * 0.7, -s * 0.2, s * 0.2, 0, Math.PI * 2);
            ctx.fill();
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(s * 0.75, -s * 0.4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(s * 0.78, -s * 0.4, 2, 0, Math.PI * 2);
            ctx.fill();
            // Beak
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(s * 0.95, -s * 0.3);
            ctx.lineTo(s * 1.3, -s * 0.25);
            ctx.lineTo(s * 0.95, -s * 0.15);
            ctx.closePath();
            ctx.fill();
        } else { // swallow
            // Body - sleek
            ctx.fillStyle = '#1A237E';
            ctx.beginPath();
            ctx.ellipse(0, 0, s * 0.8, s * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            // Belly
            ctx.fillStyle = '#FFCCBC';
            ctx.beginPath();
            ctx.ellipse(2, 3, s * 0.45, s * 0.35, 0, 0, Math.PI * 2);
            ctx.fill();
            // Wings - long and pointed
            ctx.fillStyle = '#283593';
            let wingFlap = Math.sin(frameCount * 0.5) * 12;
            ctx.beginPath();
            ctx.moveTo(-3, 0);
            ctx.lineTo(-s * 1.2, -s * 0.8 + wingFlap);
            ctx.lineTo(-s * 0.3, -s * 0.1);
            ctx.closePath();
            ctx.fill();
            // Head
            ctx.fillStyle = '#1A237E';
            ctx.beginPath();
            ctx.arc(s * 0.55, -s * 0.15, s * 0.35, 0, Math.PI * 2);
            ctx.fill();
            // Red throat
            ctx.fillStyle = '#D32F2F';
            ctx.beginPath();
            ctx.arc(s * 0.5, s * 0.05, s * 0.15, 0, Math.PI * 2);
            ctx.fill();
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(s * 0.65, -s * 0.2, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(s * 0.68, -s * 0.2, 1.8, 0, Math.PI * 2);
            ctx.fill();
            // Beak
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(s * 0.8, -s * 0.15);
            ctx.lineTo(s * 1.2, -s * 0.1);
            ctx.lineTo(s * 0.8, -s * 0.02);
            ctx.closePath();
            ctx.fill();
            // Tail fork
            ctx.fillStyle = '#1A237E';
            ctx.beginPath();
            ctx.moveTo(-s * 0.7, 0);
            ctx.lineTo(-s * 1.3, -s * 0.3);
            ctx.lineTo(-s * 0.9, 0);
            ctx.lineTo(-s * 1.3, s * 0.3);
            ctx.closePath();
            ctx.fill();
        }

        ctx.restore();
    }

    // Draw obstacle (pipe-like but themed)
    function drawObstacle(obs) {
        let gapY = obs.gapY;
        let gapH = obs.gapH;

        if (location === 'city') {
            // Buildings as obstacles
            let buildColor = timeOfDay === 'night' ? '#2a3a4a' : '#78909C';
            let buildColorDark = timeOfDay === 'night' ? '#1a2a3a' : '#546E7A';
            
            // Top building
            ctx.fillStyle = buildColor;
            ctx.fillRect(obs.x, 0, obs.width, gapY - gapH / 2);
            ctx.fillStyle = buildColorDark;
            ctx.fillRect(obs.x, gapY - gapH / 2 - 15, obs.width + 8, 15);
            // Windows on top
            if (timeOfDay === 'night') {
                let seed = Math.floor(obs.x * 7.3);
                for (let wy = 10; wy < gapY - gapH/2 - 20; wy += 20) {
                    let hash1 = ((seed + wy * 13) * 2654435761) >>> 0;
                    let hash2 = ((seed + wy * 17 + 999) * 2654435761) >>> 0;
                    ctx.fillStyle = (hash1 % 100 < 50) ? '#FFE082' : '#1a2a3a';
                    ctx.fillRect(obs.x + 5, wy, 10, 12);
                    ctx.fillStyle = (hash2 % 100 < 50) ? '#FFE082' : '#1a2a3a';
                    ctx.fillRect(obs.x + obs.width - 15, wy, 10, 12);
                }
            }

            // Bottom building
            ctx.fillStyle = buildColor;
            ctx.fillRect(obs.x, gapY + gapH / 2, obs.width, H - gapY - gapH / 2);
            ctx.fillStyle = buildColorDark;
            ctx.fillRect(obs.x, gapY + gapH / 2, obs.width + 8, 15);
            // Windows on bottom
            if (timeOfDay === 'night') {
                let seed = Math.floor(obs.x * 11.7);
                for (let wy = gapY + gapH/2 + 20; wy < H - 80; wy += 20) {
                    let hash1 = ((seed + wy * 13) * 2654435761) >>> 0;
                    let hash2 = ((seed + wy * 17 + 999) * 2654435761) >>> 0;
                    ctx.fillStyle = (hash1 % 100 < 50) ? '#FFE082' : '#1a2a3a';
                    ctx.fillRect(obs.x + 5, wy, 10, 12);
                    ctx.fillStyle = (hash2 % 100 < 50) ? '#FFE082' : '#1a2a3a';
                    ctx.fillRect(obs.x + obs.width - 15, wy, 10, 12);
                }
            }
        } else {
            // Forest - tree trunks and branches
            let trunkColor = timeOfDay === 'night' ? '#3E2723' : '#5D4037';
            let trunkColorDark = timeOfDay === 'night' ? '#2a1a10' : '#4E342E';
            
            // Top trunk
            ctx.fillStyle = trunkColor;
            ctx.fillRect(obs.x + 5, 0, obs.width - 10, gapY - gapH / 2);
            // Bark texture
            ctx.fillStyle = trunkColorDark;
            for (let ty = 0; ty < gapY - gapH/2; ty += 15) {
                ctx.fillRect(obs.x + 8, ty, 5, 8);
            }
            // Branches at gap edge
            ctx.fillStyle = timeOfDay === 'night' ? '#1a3a1a' : '#2E7D32';
            ctx.beginPath();
            ctx.arc(obs.x + obs.width/2, gapY - gapH/2, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(obs.x + obs.width/2 - 15, gapY - gapH/2 + 5, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(obs.x + obs.width/2 + 15, gapY - gapH/2 + 5, 18, 0, Math.PI * 2);
            ctx.fill();

            // Bottom trunk
            ctx.fillStyle = trunkColor;
            ctx.fillRect(obs.x + 5, gapY + gapH / 2, obs.width - 10, H - gapY - gapH / 2);
            ctx.fillStyle = trunkColorDark;
            for (let ty = gapY + gapH/2; ty < H - 80; ty += 15) {
                ctx.fillRect(obs.x + 8, ty, 5, 8);
            }
            // Branches at gap edge
            ctx.fillStyle = timeOfDay === 'night' ? '#1a3a1a' : '#2E7D32';
            ctx.beginPath();
            ctx.arc(obs.x + obs.width/2, gapY + gapH/2, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(obs.x + obs.width/2 - 15, gapY + gapH/2 - 5, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(obs.x + obs.width/2 + 15, gapY + gapH/2 - 5, 18, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Draw worm
    function drawWorm(w) {
        ctx.save();
        ctx.translate(w.x, w.y);
        
        let wiggle = Math.sin(frameCount * 0.1 + w.x) * 3;
        
        // Worm body segments
        let segCount = w.size === 'small' ? 4 : w.size === 'medium' ? 6 : 8;
        let segSize = w.size === 'small' ? 4 : w.size === 'medium' ? 5 : 7;
        let totalLen = segCount * segSize * 1.2;

        // Color based on points
        let colors = {
            1: { body: '#FFD54F', outline: '#F9A825' },  // yellow
            2: { body: '#66BB6A', outline: '#2E7D32' },  // green
            3: { body: '#EF5350', outline: '#C62828' }   // red
        };
        let c = colors[w.points];

        // Draw segments
        for (let i = segCount - 1; i >= 0; i--) {
            let sx = -totalLen/2 + i * segSize * 1.2;
            let sy = Math.sin(frameCount * 0.15 + i * 0.8) * (3 + wiggle);
            
            ctx.fillStyle = c.body;
            ctx.strokeStyle = c.outline;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(sx, sy, segSize - i * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        // Head
        let headX = totalLen/2;
        let headY = Math.sin(frameCount * 0.15) * 3;
        ctx.fillStyle = c.body;
        ctx.strokeStyle = c.outline;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(headX, headY, segSize + 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(headX + 2, headY - 3, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(headX + 3, headY - 3, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Smile
        ctx.strokeStyle = c.outline;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(headX + 2, headY + 1, 3, 0, Math.PI);
        ctx.stroke();

        ctx.restore();
    }

    // Create obstacle
    function createObstacle() {
        let gapH = 140 - gameSpeed * 5;
        if (gapH < 100) gapH = 100;
        let gapY = Math.random() * (H - 200) + 100;
        obstacles.push({
            x: W + 50,
            width: 55,
            gapY: gapY,
            gapH: gapH,
            passed: false
        });
    }

    // Create worm
    function createWorm() {
        let sizes = ['small', 'medium', 'big'];
        let points = [1, 2, 3];
        let idx = Math.floor(Math.random() * 3);
        worms.push({
            x: W + 30,
            y: Math.random() * (H - 200) + 100,
            size: sizes[idx],
            points: points[idx],
            collected: false
        });
    }

    // Particles
    function addParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                life: 30 + Math.random() * 20,
                maxLife: 50,
                color: color,
                size: Math.random() * 4 + 2
            });
        }
    }

    function addScorePopup(x, y, text) {
        scorePopups.push({ x, y, text, life: 60, vy: -2 });
    }

    // Initialize game
    function initGame() {
        let birdConfig = BIRDS[selectedBird];
        bird = {
            x: 80,
            y: H / 2,
            vy: 0,
            size: birdConfig.size,
            type: selectedBird,
            flapForce: birdConfig.flapForce
        };
        obstacles = [];
        worms = [];
        particles = [];
        scorePopups = [];
        score = 0;
        lives = 3;
        gameSpeed = 1;
        frameCount = 0;
        spawnTimer = 0;
        wormTimer = 0;
        groundOffset = 0;
        invincibleTimer = 0;
        shakeTimer = 0;
        newRecord = false;
        generateBackground();
    }

    // Flap
    function flap() {
        if (gameState === STATE.PLAYING) {
            bird.vy = bird.flapForce;
        }
    }

    // Update game
    function update() {
        if (gameState !== STATE.PLAYING) return;

        groundOffset -= BIRDS[selectedBird].speed * gameSpeed;

        // Speed increase
        spawnTimer++;
        wormTimer++;
        if (spawnTimer % 300 === 0) {
            gameSpeed += 0.1;
        }

        // Bird physics
        bird.vy += 0.4; // gravity
        bird.y += bird.vy;

        // Boundaries
        if (bird.y - bird.size < 0) {
            bird.y = bird.size;
            bird.vy = 0;
        }
        if (bird.y + bird.size > H - 80) {
            bird.y = H - 80 - bird.size;
            bird.vy = 0;
            if (invincibleTimer <= 0) {
                loseLife();
            }
        }

        // Spawn obstacles
        let spawnRate = Math.max(80, 140 - gameSpeed * 12);
        if (spawnTimer % Math.floor(spawnRate) === 0) {
            createObstacle();
        }

        // Spawn worms
        if (wormTimer % Math.floor(spawnRate * 0.6) === 0) {
            if (Math.random() < 0.55) {
                createWorm();
            }
        }

        // Update obstacles
        let speed = BIRDS[selectedBird].speed * gameSpeed;
        obstacles.forEach(obs => {
            obs.x -= speed;
            
            // Check collision
            if (!obs.passed && obs.x + obs.width < bird.x) {
                obs.passed = true;
            }

            // Collision detection
            if (invincibleTimer <= 0) {
                let birdLeft = bird.x - bird.size * 0.7;
                let birdRight = bird.x + bird.size * 0.7;
                let birdTop = bird.y - bird.size * 0.6;
                let birdBottom = bird.y + bird.size * 0.6;

                if (birdRight > obs.x && birdLeft < obs.x + obs.width) {
                    if (birdTop < obs.gapY - obs.gapH / 2 || birdBottom > obs.gapY + obs.gapH / 2) {
                        loseLife();
                    }
                }
            }
        });

        // Update worms
        worms.forEach(w => {
            w.x -= speed;
            
            if (!w.collected) {
                let dx = bird.x - w.x;
                let dy = bird.y - w.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let collectDist = w.size === 'small' ? 20 : w.size === 'medium' ? 25 : 30;
                
                if (dist < collectDist + bird.size * 0.5) {
                    w.collected = true;
                    score += w.points;
                    let colors = { 1: '#FFD54F', 2: '#66BB6A', 3: '#EF5350' };
                    addParticles(w.x, w.y, colors[w.points], 8);
                    addScorePopup(w.x, w.y, `+${w.points}`);
                }
            }
        });

        // Cleanup
        obstacles = obstacles.filter(o => o.x > -100);
        worms = worms.filter(w => w.x > -50 && !w.collected);

        // Update particles
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.life--;
        });
        particles = particles.filter(p => p.life > 0);

        // Update score popups
        scorePopups.forEach(p => {
            p.y += p.vy;
            p.life--;
        });
        scorePopups = scorePopups.filter(p => p.life > 0);

        // Timers
        if (invincibleTimer > 0) invincibleTimer--;
        if (shakeTimer > 0) shakeTimer--;
    }

    function loseLife() {
        lives--;
        invincibleTimer = 90;
        shakeTimer = 15;
        addParticles(bird.x, bird.y, '#ff4444', 12);
        
        if (lives <= 0) {
            gameOver();
        }
    }

    function gameOver() {
        gameState = STATE.GAMEOVER;
        prevHighScore = highScore;
        if (score > highScore) {
            highScore = score;
            newRecord = true;
            localStorage.setItem('wormyWingsHighScore', highScore);
        }
    }

    // Draw HUD
    function drawHUD() {
        // Score
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        drawRoundRect(10, 10, 120, 40, 10);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px Comic Sans MS, cursive';
        ctx.textAlign = 'left';
        ctx.fillText(`🪱 ${score}`, 20, 37);

        // Lives
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        drawRoundRect(W - 110, 10, 100, 40, 10);
        ctx.fill();
        for (let i = 0; i < lives; i++) {
            ctx.fillStyle = '#EF5350';
            ctx.font = '22px serif';
            ctx.fillText('❤️', W - 100 + i * 30, 37);
        }

        // Speed indicator
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        drawRoundRect(W/2 - 40, 10, 80, 25, 8);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '12px Comic Sans MS, cursive';
        ctx.textAlign = 'center';
        ctx.fillText(`⚡ x${gameSpeed.toFixed(1)}`, W/2, 27);

        // Score popups
        scorePopups.forEach(p => {
            let alpha = p.life / 60;
            ctx.fillStyle = `rgba(255, 255, 100, ${alpha})`;
            ctx.font = 'bold 18px Comic Sans MS, cursive';
            ctx.textAlign = 'center';
            ctx.fillText(p.text, p.x, p.y);
        });
    }

    // Draw menu
    function drawMenu() {
        // Background
        drawBackground();
        
        // Overlay
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);

        // Title
        ctx.save();
        ctx.shadowColor = '#FFD740';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#FFD740';
        ctx.font = 'bold 36px Comic Sans MS, cursive';
        ctx.textAlign = 'center';
        ctx.fillText('🐦 Wormy Wings 🪱', W/2, 80);
        ctx.restore();
        
        ctx.fillStyle = '#fff';
        ctx.font = '16px Comic Sans MS, cursive';
        ctx.fillText('Птичий пир', W/2, 110);

        // High score
        if (highScore > 0) {
            ctx.fillStyle = '#FFD740';
            ctx.font = '14px Comic Sans MS, cursive';
            ctx.fillText(`🏆 Рекорд: ${highScore}`, W/2, 140);
        }

        // Bird selection
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Comic Sans MS, cursive';
        ctx.fillText('Выбери птичку:', W/2, 185);

        let birds = ['pigeon', 'tit', 'swallow'];
        let birdNames = ['🐦 Голубь', '🐤 Синичка', '🐦‍⬛ Ласточка'];
        let birdDescs = ['Толстый, медленный', 'Маленькая, средняя', 'Очень быстрая'];
        let birdDiff = ['⭐', '⭐⭐', '⭐⭐⭐'];

        birds.forEach((b, i) => {
            let y = 220 + i * 100;
            let isSelected = menuSelection === i;
            
            // Card background
            ctx.fillStyle = isSelected ? 'rgba(255, 215, 0, 0.3)' : 'rgba(255,255,255,0.1)';
            ctx.strokeStyle = isSelected ? '#FFD740' : 'rgba(255,255,255,0.3)';
            ctx.lineWidth = isSelected ? 3 : 1;
            drawRoundRect(W/2 - 140, y - 30, 280, 80, 15);
            ctx.fill();
            ctx.stroke();

            // Bird preview
            let tempBird = { x: W/2 - 80, y: y + 10, size: BIRDS[b].size, type: b, vy: 0 };
            drawBird(tempBird);

            // Text
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Comic Sans MS, cursive';
            ctx.textAlign = 'left';
            ctx.fillText(birdNames[i], W/2 - 40, y);
            ctx.font = '13px Comic Sans MS, cursive';
            ctx.fillStyle = '#ccc';
            ctx.fillText(birdDescs[i], W/2 - 40, y + 20);
            ctx.fillStyle = '#FFD740';
            ctx.fillText(birdDiff[i], W/2 - 40, y + 38);
        });

        // Instructions
        ctx.textAlign = 'center';
        ctx.fillStyle = '#aaa';
        ctx.font = '14px Comic Sans MS, cursive';
        ctx.fillText('↑↓ — выбор, Enter — начать', W/2, H - 60);
        ctx.fillText('или нажми на птичку мышкой', W/2, H - 38);

        // Controls hint
        ctx.fillStyle = '#888';
        ctx.font = '12px Comic Sans MS, cursive';
        ctx.fillText('Пробел / Клик — взмах крыльями', W/2, H - 15);
    }

    // Draw game over screen
    function drawGameOver() {
        // Overlay
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);

        // Panel
        ctx.fillStyle = 'rgba(30, 30, 60, 0.95)';
        ctx.strokeStyle = '#FFD740';
        ctx.lineWidth = 3;
        drawRoundRect(W/2 - 160, H/2 - 150, 320, 300, 20);
        ctx.fill();
        ctx.stroke();

        // Title
        ctx.fillStyle = '#EF5350';
        ctx.font = 'bold 28px Comic Sans MS, cursive';
        ctx.textAlign = 'center';
        ctx.fillText('Игра окончена!', W/2, H/2 - 100);

        // Score
        ctx.fillStyle = '#fff';
        ctx.font = '20px Comic Sans MS, cursive';
        ctx.fillText(`Очки: ${score}`, W/2, H/2 - 50);

        // High score
        ctx.fillStyle = '#FFD740';
        ctx.font = '16px Comic Sans MS, cursive';
        ctx.fillText(`Рекорд: ${highScore}`, W/2, H/2 - 15);

        // New record
        if (newRecord) {
            ctx.save();
            ctx.shadowColor = '#FFD740';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#FFD740';
            ctx.font = 'bold 22px Comic Sans MS, cursive';
            let pulse = 1 + Math.sin(frameCount * 0.1) * 0.05;
            ctx.save();
            ctx.translate(W/2, H/2 + 25);
            ctx.scale(pulse, pulse);
            ctx.fillText('🎉 Новый рекорд! 🎉', 0, 0);
            ctx.restore();
            ctx.restore();
        } else if (score > 0 && score >= prevHighScore && prevHighScore > 0) {
            ctx.fillStyle = '#aaa';
            ctx.font = '14px Comic Sans MS, cursive';
            ctx.fillText(`До рекорда: ${highScore - score}`, W/2, H/2 + 25);
        }

        // Bird used
        ctx.fillStyle = '#ccc';
        ctx.font = '14px Comic Sans MS, cursive';
        ctx.fillText(`Птичка: ${BIRDS[selectedBird].name}`, W/2, H/2 + 60);

        // Restart button
        let btnY = H/2 + 90;
        ctx.fillStyle = '#4CAF50';
        drawRoundRect(W/2 - 80, btnY, 160, 45, 12);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Comic Sans MS, cursive';
        ctx.fillText('🔄 Играть снова', W/2, btnY + 28);

        // Back to menu
        ctx.fillStyle = '#666';
        ctx.font = '13px Comic Sans MS, cursive';
        ctx.fillText('M — в меню', W/2, btnY + 65);
    }

    // Main draw
    function draw() {
        ctx.save();
        
        // Screen shake
        if (shakeTimer > 0) {
            ctx.translate(
                (Math.random() - 0.5) * shakeTimer,
                (Math.random() - 0.5) * shakeTimer
            );
        }

        if (gameState === STATE.MENU) {
            drawMenu();
        } else {
            drawBackground();
            
            // Draw worms
            worms.forEach(w => {
                if (!w.collected) drawWorm(w);
            });

            // Draw obstacles
            obstacles.forEach(obs => drawObstacle(obs));

            // Draw bird
            if (bird) drawBird(bird);

            // Draw particles
            particles.forEach(p => {
                let alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // HUD
            drawHUD();

            if (gameState === STATE.GAMEOVER) {
                drawGameOver();
            }
        }

        ctx.restore();
    }

    // Game loop
    function gameLoop() {
        frameCount++;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Input handling
    document.addEventListener('keydown', (e) => {
        if (gameState === STATE.MENU) {
            if (e.key === 'ArrowUp') {
                menuSelection = (menuSelection - 1 + 3) % 3;
            } else if (e.key === 'ArrowDown') {
                menuSelection = (menuSelection + 1) % 3;
            } else if (e.key === 'Enter' || e.key === ' ') {
                selectedBird = ['pigeon', 'tit', 'swallow'][menuSelection];
                initGame();
                gameState = STATE.PLAYING;
            }
        } else if (gameState === STATE.PLAYING) {
            if (e.key === ' ' || e.key === 'ArrowUp') {
                e.preventDefault();
                flap();
            }
        } else if (gameState === STATE.GAMEOVER) {
            if (e.key === 'Enter' || e.key === ' ') {
                initGame();
                gameState = STATE.PLAYING;
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') {
                gameState = STATE.MENU;
            }
        }
    });

    canvas.addEventListener('click', (e) => {
        let rect = canvas.getBoundingClientRect();
        let scaleX = W / rect.width;
        let scaleY = H / rect.height;
        let mx = (e.clientX - rect.left) * scaleX;
        let my = (e.clientY - rect.top) * scaleY;

        if (gameState === STATE.MENU) {
            // Check bird selection
            let birds = ['pigeon', 'tit', 'swallow'];
            birds.forEach((b, i) => {
                let y = 220 + i * 100;
                if (mx > W/2 - 140 && mx < W/2 + 140 && my > y - 30 && my < y + 50) {
                    menuSelection = i;
                    selectedBird = b;
                    initGame();
                    gameState = STATE.PLAYING;
                }
            });
        } else if (gameState === STATE.PLAYING) {
            flap();
        } else if (gameState === STATE.GAMEOVER) {
            // Check restart button
            let btnY = H/2 + 90;
            if (mx > W/2 - 80 && mx < W/2 + 80 && my > btnY && my < btnY + 45) {
                initGame();
                gameState = STATE.PLAYING;
            }
        }
    });

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameState === STATE.PLAYING) {
            flap();
        } else if (gameState === STATE.GAMEOVER) {
            initGame();
            gameState = STATE.PLAYING;
        }
    });

    // Start
    generateBackground();
    gameLoop();
    </script>
</body>
